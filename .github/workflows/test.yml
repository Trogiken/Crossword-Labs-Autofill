name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check manifest
        run: node -e "const m=require('./extension/manifest.json'); if(!/^\d+(\.\d+){0,3}$/.test(m.version)) throw new Error('bad version ' + m.version)"
      - name: Run tests
        run: node --test
