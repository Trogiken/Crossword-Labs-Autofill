<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1a1a1a;
      --paper: #ffffff;
      --shade: #f2f2ee;
      --ok: #2f7d4f;
      --err: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 260px;
      padding: 16px 16px 12px;
      font: 14px/1.4 Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--shade);
    }

    h1 {
      font-size: 17px;
      margin: 0 0 12px;
      font-weight: normal;
    }

    .cell {
      display: block;
      width: 100%;
      margin: 0;
      padding: 12px 14px;
      text-align: left;
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 0;
      cursor: pointer;
    }

    .cell strong {
      display: block;
      font-size: 15px;
    }

    .cell small {
      display: block;
      color: #555;
      font-size: 12px;
      margin-top: 2px;
    }

    .cell:hover {
      background: #fffbe0;
    }

    .cell:focus-visible {
      outline: 3px solid #3b6fd8;
      outline-offset: 2px;
    }

    .cell:disabled {
      opacity: .6;
      cursor: default;
    }

    #status {
      min-height: 1.4em;
      margin: 8px 0 0;
      font-size: 13px;
    }

    #status.ok {
      color: var(--ok);
    }

    #status.err {
      color: var(--err);
    }


    footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #d6d6d0;
      font-size: 11px;
      color: #666;
    }

    footer p {
      margin: 0 0 4px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .actions > * {
      white-space: nowrap;
    }

    #report {
      padding: 3px 8px;
      font: 11px/1.4 Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid #bdbdb6;
      border-radius: 0;
      cursor: pointer;
    }

    #report:hover {
      background: #fffbe0;
    }

    #report:focus-visible {
      outline: 2px solid #3b6fd8;
      outline-offset: 1px;
    }

    /* Shown after an error, so reporting it is one obvious click. */
    #error {
      margin: 10px 0 0;
      padding: 10px 12px 12px;
      background: #fdf0ef;
      border: 2px solid var(--err);
    }

    #error[hidden] {
      display: none;
    }

    #error p {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--err);
    }

    #error-code {
      display: inline-block;
      margin-right: 6px;
      padding: 0 5px;
      font: bold 11px/1.6 ui-monospace, Consolas, monospace;
      color: var(--paper);
      background: var(--err);
    }

    #report-error {
      display: block;
      width: 100%;
      padding: 8px 10px;
      font: bold 14px/1.3 Georgia, "Times New Roman", serif;
      color: var(--paper);
      background: var(--err);
      border: 0;
      border-radius: 0;
      cursor: pointer;
    }

    #report-error:hover {
      background: #8f1e18;
    }

    #report-error:focus-visible {
      outline: 3px solid #3b6fd8;
      outline-offset: 2px;
    }

    #error small {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: #7a4a47;
    }

    footer a {
      color: #1a1a1a;
    }

    footer a:focus-visible {
      outline: 2px solid #3b6fd8;
      outline-offset: 1px;
    }
  </style>
</head>

<body>
  <h1>Crossword Labs Autofill</h1>
  <button class="cell" id="fill">
    <strong>Fill and grade puzzle</strong>
    <small>Fills every box, saves progress, and reloads.</small>
  </button>
  <p id="status" role="status"></p>
  <div id="error" role="alert" hidden>
    <p><span id="error-code"></span><span id="error-msg"></span></p>
    <button type="button" id="report-error">Report this problem</button>
    <small>Opens a pre-filled GitHub issue. Nothing is sent until you submit it.</small>
  </div>
  <footer>
    <div class="actions">
      <a href="https://github.com/Trogiken/crossword-labs-autofill" id="source">View source on GitHub</a>
      <button type="button" id="report">Report a problem</button>
    </div>
    <p>Not affiliated with or endorsed by CrosswordLabs.com</p>
  </footer>
  <script src="popup.js"></script>
</body>

</html>
